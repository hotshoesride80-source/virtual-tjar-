<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual TJAR | FIT</title><style>body{font-family:system-ui,sans-serif;background:#0e1721;color:#f5f7fa;margin:0;padding:20px;line-height:1.6}main{max-width:650px;margin:auto}h1{font-size:25px}.card{background:#1d2b39;padding:20px;border-radius:15px;margin:16px 0}input,button{font:inherit}input[type=file]{width:100%}button{background:#52d4a3;border:0;border-radius:8px;padding:10px 15px;font-weight:bold}small,.muted{color:#b5c2cf}strong{font-size:22px}progress{width:100%;height:18px;accent-color:#52d4a3}li{margin:7px 0}.err{color:#ffb6b6}</style><main><h1>⛰ Virtual TJAR</h1><p class="muted">個人専用・Garmin FIT取込試作版</p><div class="card"><h2>① Garminデータを読み込む</h2><input id="file" type="file" accept=".fit,.zip"><p><small>Garmin Connectの「ファイルのエクスポート」で取得したZIP、または展開したFITに対応。解析は端末内で実行し、外部へ送信しません。</small></p><div id="status">ファイルを選択してください。</div></div><div class="card"><h2>② 取得した運動記録</h2><div id="metrics">未読込</div></div><div class="card"><h2>③ バーチャル踏破</h2><label>仮の目標距離（km） <input id="goal" type="number" value="415" min="1" step="0.1" style="width:90px"></label><p><progress id="progress" value="0" max="100"></progress></p><div id="result">0%</div><small>415kmは動作確認用の仮設定です。公式コース距離ではありません。実レースの距離・累積標高・所要時間を単純に同一視しません。</small></div><div class="card"><h2>④ 記録の管理</h2><button id="save" disabled>この記録を端末に保存</button> <button id="clear">保存記録を削除</button><div id="history"></div><small>同じFITの二重登録を防ぎます。端末のブラウザデータを消すと記録も失われます。</small></div></main><script>
const $=x=>document.getElementById(x);let pending=null;const key='virtual_tjar_fit_v1';let history=JSON.parse(localStorage.getItem(key)||'[]');
function val(d,p,t){if(p+({0:1,1:1,2:1,10:1,13:1,131:1,132:2,133:4,134:8,136:4,137:8,139:2,140:4,142:8,7:1,8:2,9:4}[t&31]||1)>d.byteLength)return null;let v=new DataView(d.buffer,d.byteOffset,d.byteLength),b=t&31;switch(b){case 0:case 2:case 10:case 13:return v.getUint8(p);case 1:return v.getInt8(p);case 3:return v.getInt16(p,true);case 4:return v.getUint16(p,true);case 5:return v.getInt32(p,true);case 6:return v.getUint32(p,true);case 8:return v.getFloat32(p,true);case 9:return v.getFloat64(p,true);default:return null}}
function parseFIT(a){let d=new Uint8Array(a),v=new DataView(a);if(d.length<14||String.fromCharCode(...d.slice(8,12))!=='.FIT')throw Error('FIT形式ではありません');let h=d[0],end=Math.min(d.length,h+v.getUint32(4,true)),defs={},sessions=[],records=0,first=null,last=null;let pos=h;while(pos<end){let head=d[pos++],local=(head&0x80)?((head>>5)&3):(head&15);if(!(head&0x80)&&(head&0x40)){let arch=d[pos+1],little=arch===0,global=v.getUint16(pos+2,little),count=d[pos+4];pos+=5;let fields=[];for(let j=0;j<count;j++){fields.push({n:d[pos],size:d[pos+1],type:d[pos+2]});pos+=3}if(head&0x20){let dev=d[pos++];pos+=dev*3}defs[local]={global,fields,little};continue}let def=defs[local];if(!def)throw Error('FITの定義が不足しています');let obj={};for(let f of def.fields){let raw=d.subarray(pos,pos+f.size);if(raw.length<f.size)throw Error('FITデータが途中で切れています');let view=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);let b=f.type&31,n=null;try{if(f.size===1)n=(b===1?view.getInt8(0):view.getUint8(0));else if(f.size===2)n=b===3?view.getInt16(0,def.little):view.getUint16(0,def.little);else if(f.size===4)n=b===8?view.getFloat32(0,def.little):b===5?view.getInt32(0,def.little):view.getUint32(0,def.little);else if(f.size===8&&b===9)n=view.getFloat64(0,def.little)}catch{}if(n!==null)obj[f.n]=n;pos+=f.size}if(def.global===18)sessions.push(obj);if(def.global===20){records++;if(obj[253]!=null){first=first===null?obj[253]:first;last=obj[253]}}}let s=sessions.sort((a,b)=>(b[9]||0)-(a[9]||0))[0]||{};let distance=s[9]!=null?s[9]/100000:null,elapsed=s[7]!=null?s[7]/1000:null,moving=s[8]!=null?s[8]/1000:null,ascent=s[22]!=null?s[22]:null,descent=s[23]!=null?s[23]:null,hr=s[16]!=null?s[16]:null;return {distance,elapsed,moving,ascent,descent,hr,records,sessions:sessions.length,first,last}}
async function unzip(ab){let d=new DataView(ab),u=new Uint8Array(ab),p=0;while(p+30<=u.length){if(d.getUint32(p,true)!==0x04034b50)break;let flags=d.getUint16(p+6,true),method=d.getUint16(p+8,true),compressed=d.getUint32(p+18,true),nameLen=d.getUint16(p+26,true),extra=d.getUint16(p+28,true),name=new TextDecoder().decode(u.slice(p+30,p+30+nameLen)),start=p+30+nameLen+extra;if(flags&8)throw Error('このZIPはAndroidのファイルアプリで展開してFITを選択してください');if(name.toLowerCase().endsWith('.fit')){let bytes=u.slice(start,start+compressed);if(method===0)return bytes.buffer;if(method===8){try{let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(stream).arrayBuffer()}catch{throw Error('ZIPを展開してFITファイルを選択してください（このブラウザはZIP解凍に非対応）')}}throw Error('未対応のZIP圧縮方式です')}p=start+compressed}throw Error('ZIP内にFITファイルが見つかりません')}
function formatSec(s){if(s==null)return '取得できません';let h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=Math.floor(s%60);return `${h}時間${m}分${ss}秒`}
function show(){let all=[...history,...(pending&&!history.some(x=>x.id===pending.id)?[pending]:[])],sum=all.reduce((a,x)=>a+(x.distance||0),0),goal=Number($('goal').value)||415,pct=Math.min(100,sum/goal*100);$('progress').value=pct;$('result').textContent=`${sum.toFixed(2)} km / ${goal} km（${pct.toFixed(1)}%）`;$('history').innerHTML=history.length?'<h3>保存済み</h3><ul>'+history.map(x=>`<li>${x.name.replace(/[<>&]/g,'')}：${x.distance?.toFixed(2)??'不明'} km</li>`).join('')+'</ul>':'<p class="muted">保存記録なし</p>'}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('status').textContent='解析中…';try{let ab=await f.arrayBuffer();if(f.name.toLowerCase().endsWith('.zip'))ab=await unzip(ab);let r=parseFIT(ab);let id=`${r.first}-${r.last}-${r.distance}-${r.records}`;pending={...r,id,name:f.name};$('metrics').innerHTML=`<p>距離：<strong>${r.distance?.toFixed(2)??'不明'} km</strong></p><p>経過時間：${formatSec(r.elapsed)}</p><p>移動時間：${formatSec(r.moving)}</p><p>累積上昇：${r.ascent??'取得できません'} m</p><p>累積下降：${r.descent??'取得できません'} m</p><p>平均心拍：${r.hr??'取得できません'} bpm</p><p>記録ポイント：${r.records} 件</p>`;$('status').textContent='FITの解析が完了しました。';$('save').disabled=history.some(x=>x.id===id);show()}catch(err){pending=null;$('save').disabled=true;$('status').innerHTML='<span class="err">'+err.message+'</span>';show()}};
$('save').onclick=()=>{if(!pending||history.some(x=>x.id===pending.id))return;history.push(pending);localStorage.setItem(key,JSON.stringify(history));pending=null;$('save').disabled=true;show()};$('clear').onclick=()=>{if(!confirm('保存した全記録を削除しますか？'))return;history=[];pending=null;localStorage.removeItem(key);$('save').disabled=true;show()};$('goal').oninput=show;show();
</script></html>
